<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f8f34">
<title>Movilidades Huarmey</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--v:#3f8f34;--vc:#e2f1dc;--r:#d12e1c;--rc:#fde4df;--bg:#f6f3ea;--t:#2b2f2a;--l:#d9d4c4;--am:#fff3cd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--v);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
header img{width:42px;height:42px;background:#fff;border-radius:50%;padding:3px}
header h1{font-size:17px;margin:0;flex:1;line-height:1.15}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--vc);color:#1f5d17}
.pill.off{background:var(--rc);color:#8f1a0e}
.badge{background:var(--r);color:#fff;border-radius:99px;min-width:24px;text-align:center;padding:2px 7px;font-size:13px;font-weight:700}
main{max-width:640px;margin:0 auto;padding:12px}
section{display:none}section.on{display:block}
h2{font-size:19px;margin:6px 0 10px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--l);border-radius:10px;background:#fff;min-height:48px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--vc);border-color:var(--v)}
input[readonly]{background:var(--vc);border-color:transparent}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.libres{font-size:22px;font-weight:700;text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:54px;padding:0 18px;cursor:pointer;background:var(--v);color:#fff;width:100%;margin-top:16px}
button.sec{background:#fff;color:var(--v);border:2px solid var(--v)}
button.peq{min-height:42px;width:auto;margin:6px 6px 0 0;padding:0 14px;font-size:14px}
button.rojo{background:var(--rc);color:#8f1a0e}
button:disabled{opacity:.5}
.err{background:var(--rc);color:#8f1a0e;border-radius:10px;padding:10px 12px;margin-top:12px;display:none;font-weight:600}
.hint{font-size:13px;color:#6b6f66;margin-top:4px}
.ok{color:#1f5d17;font-weight:600}.mal{color:#8f1a0e;font-weight:600}
.item{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:6px solid var(--am)}
.item.Sincronizado{border-color:var(--v)}.item.Error{border-color:var(--r)}
.item small{color:#6b6f66;display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:8px 0 6px;font-size:13px;font-weight:600;color:#6b6f66;position:relative}
nav a.on{color:var(--v);background:var(--vc)}
nav svg{display:block;margin:0 auto 2px;width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .badge{position:absolute;top:2px;left:58%}
#toast{position:fixed;left:12px;right:12px;bottom:96px;background:var(--t);color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9;text-align:center}
#diag{white-space:pre-wrap;background:#fff;border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,monospace;display:none}
</style></head><body>
<header>
  <img src="logo.png" alt="Agrícola Huarmey">
  <h1>Movilidades<br>Agrícola Huarmey</h1>
  <span id="net" class="pill">En línea</span><span id="nPend" class="badge" style="display:none">0</span>
</header>
<main>
<section id="p1" class="on">
  <h2>Registro de movilidades</h2>
  <label for="r_fecha">Fecha</label><input type="date" id="r_fecha">
  <label for="r_placa">Placa de unidad</label>
  <input id="r_placa" list="dl_placas" placeholder="Escribe o elige la placa" autocomplete="off" autocapitalize="characters">
  <datalist id="dl_placas"></datalist>
  <label for="r_conductor">Conductor</label><input id="r_conductor" readonly>
  <div class="g2"><div><label for="r_tipo">Tipo</label><input id="r_tipo" readonly></div><div><label for="r_cap">Capacidad</label><input id="r_cap" readonly></div></div>
  <label for="r_ruta">Ruta</label><input id="r_ruta" readonly>
  <label for="r_cultivo">Cultivo</label><input id="r_cultivo" readonly>
  <div class="g2"><div><label for="r_pas">N° pasajeros</label><input id="r_pas" type="number" inputmode="numeric" min="0"></div>
  <div><label for="r_libres">Asientos libres</label><input id="r_libres" class="libres" readonly></div></div>
  <label for="r_obs">Observaciones (opcional)</label><textarea id="r_obs" maxlength="300" rows="2"></textarea>
  <div id="r_err" class="err"></div>
  <button id="r_save">Guardar registro</button>
</section>
<section id="p2">
  <h2>Registro de ausentismo</h2>
  <label for="a_placa">Placa</label>
  <input id="a_placa" list="dl_placas" placeholder="Escribe o elige la placa" autocomplete="off" autocapitalize="characters">
  <label for="a_ruta">Ruta</label><input id="a_ruta" readonly>
  <label for="a_dni">DNI</label><input id="a_dni" inputmode="numeric" maxlength="8" placeholder="8 dígitos">
  <div id="a_dnimsg" class="hint"></div>
  <label for="a_nombre">Apellidos y nombres</label><input id="a_nombre" readonly>
  <label for="a_falta">Fecha de falta</label><input type="date" id="a_falta">
  <label for="a_motivo">Motivo de ausencia</label><select id="a_motivo"></select>
  <label for="a_regresa">¿Vas a regresar?</label>
  <select id="a_regresa"><option value="">Elige…</option><option>SI</option><option>NO</option><option>Lo está pensando</option></select>
  <div id="b_ret" style="display:none">
    <label for="a_ret">Fecha de retorno</label>
    <select id="a_ret"><option>Inmediato</option><option>Ingrese la fecha</option></select>
    <input type="date" id="a_retf" style="display:none;margin-top:8px">
  </div>
  <label for="a_obs">Observaciones <span id="a_obsreq" class="hint"></span></label><textarea id="a_obs" maxlength="300" rows="2"></textarea>
  <div id="a_err" class="err"></div>
  <button id="a_save">Guardar ausentismo</button>
</section>
<section id="p3">
  <h2>Pendientes de envío</h2>
  <button class="sec" id="btnSync" style="margin-top:0">Sincronizar ahora</button>
  <button class="sec" id="btnCat">Actualizar placas y personal</button>
  <div id="cola" style="margin-top:14px"></div>
  <button class="sec" id="btnDiag">Diagnóstico</button>
  <div id="diag"></div>
</section>
</main>
<div id="toast"></div>
<nav>
  <a href="#p1" class="on" data-t="p1"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M3 11h18M7 20v-4M17 20v-4"/><circle cx="7.5" cy="13.5" r=".6"/><circle cx="16.5" cy="13.5" r=".6"/></svg>Movilidades</a>
  <a href="#p2" data-t="p2"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M17 4l4 4M21 4l-4 4"/></svg>Ausentismo</a>
  <a href="#p3" data-t="p3"><svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 010-9 6 6 0 0111.5 1.5A3.7 3.7 0 0118 18z"/><path d="M12 11v5m0 0l-2-2m2 2l2-2"/></svg>Pendientes<span id="nPend2" class="badge" style="display:none">0</span></a>
</nav>
<script>
"use strict";
/* ============ CONFIG (única parte a editar) ============ */
const CONFIG={
  API_URL:'https://script.google.com/macros/s/AKfycbxNLNZdAX-sfgvtYyvy_EBc3sXwF1P19XSY5McL95dORzwq6Zf7UglD5t4u2PiokRZT/exec',
  TOKEN:'Huarmey2026-Frusan-K7x9',
  MOTIVOS:['Ninguno','Descanso médico (Absentismo)','Permiso con papeleta (Absentismo)','Enfermedad','Problemas familiares','Transporte (Especificar en observaciones)','Otro trabajo (Especificar en observaciones)','Desmotivación','Sacar tarjeta','Pago','Horario','Alimentación','Campamento','Ambiente laboral','Renuncia (Especificar en observaciones)','Problemas con el caporal (Especificar en observaciones)','Estudios','Viaje','Accidente','No desea continuar (Especificar en observaciones)']
};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
const MSG={SIN_RED:'Sin conexión a internet.',TIMEOUT:'El servidor tardó demasiado en responder.',
 TOKEN_INVALIDO:'El token es incorrecto. Revisa CONFIG.TOKEN y el token guardado en el script.',
 TOKEN_NO_CONFIGURADO:'Falta configurar el token en Apps Script (ejecuta configurarToken).',
 RESPUESTA_NO_JSON:'La URL del Web App no es pública o es incorrecta. Debe terminar en /exec y tener acceso "Cualquier persona".',
 CONFIG:'Falta pegar la URL del Web App en CONFIG.API_URL.'};
let M={},P={},ultimoError='';

/* ============ DB (IndexedDB) ============ */
const DB={db:null,
 open(){return new Promise((ok,ko)=>{const r=indexedDB.open('huarmey',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('maestros',{keyPath:'placa'});d.createObjectStore('personal',{keyPath:'dni'});d.createObjectStore('cola',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'k'});};
  r.onsuccess=()=>{DB.db=r.result;ok()};r.onerror=()=>ko(r.error);});},
 tx(s,m,f){return new Promise((ok,ko)=>{const t=DB.db.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error);});},
 all:s=>DB.tx(s,'readonly',st=>st.getAll()),
 get:(s,k)=>DB.tx(s,'readonly',st=>st.get(k)),
 put:(s,v)=>DB.tx(s,'readwrite',st=>st.put(v)),
 del:(s,k)=>DB.tx(s,'readwrite',st=>st.delete(k)),
 replace:(s,a)=>DB.tx(s,'readwrite',st=>{st.clear();a.forEach(v=>st.put(v));})
};

/* ============ API (Apps Script) ============ */
function apiErr(code){const e=new Error(MSG[code]||code);e.code=code;return e;}
async function api(method,params,body){
  if(CONFIG.API_URL.includes('PEGA_AQUI'))throw apiErr('CONFIG');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  try{
    let url=CONFIG.API_URL;const opt={redirect:'follow',signal:ctl.signal};
    if(method==='GET')url+='?'+new URLSearchParams({...params,token:CONFIG.TOKEN});
    else{opt.method='POST';opt.headers={'Content-Type':'text/plain;charset=utf-8'};opt.body=JSON.stringify({...body,token:CONFIG.TOKEN});}
    let r;try{r=await fetch(url,opt);}catch(e){throw apiErr(e.name==='AbortError'?'TIMEOUT':'SIN_RED');}
    const txt=await r.text();let j;try{j=JSON.parse(txt);}catch(e){throw apiErr('RESPUESTA_NO_JSON');}
    if(j.ok===undefined)throw apiErr('El servidor respondió algo distinto a lo esperado (probablemente código antiguo de Apps Script): '+txt.slice(0,120));
    if(!j.ok)throw apiErr((j.error||'ERROR_SERVIDOR').split(':')[0]==='HOJA_NO_ENCONTRADA'?'Falta la hoja: '+j.error.split(':')[1]:(j.error||'ERROR_SERVIDOR'));
    return j.data;
  }finally{clearTimeout(t);}
}

/* ============ SYNC ============ */
let syncing=false;
async function actualizarCatalogos(manual){
  try{
    const d=await api('GET',{action:'bootstrap'});
    await DB.replace('maestros',d.maestros);await DB.replace('personal',d.personal);
    await DB.put('meta',{k:'ultima',v:Date.now()});ultimoError='';
    await cargarListas();if(manual)toast('Listas actualizadas: '+d.maestros.length+' placas, '+d.personal.length+' personas');
  }catch(e){ultimoError=e.message;if(manual||!Object.keys(M).length)toast(e.message,true);}
}
async function enviarPendientes(manual){
  if(syncing){return;}
  if(!navigator.onLine){if(manual)toast('Sin conexión. Se enviará al volver el internet.',true);return;}
  syncing=true;
  try{
    const q=(await DB.all('cola')).filter(x=>x.estado==='Pendiente');
    if(!q.length){if(manual)toast('No hay pendientes.');return;}
    let res;
    try{res=await api('POST',{},{items:q.map(x=>({action:x.tipo,id:x.id,data:x.datos}))});}
    catch(e){ultimoError=e.message;for(const x of q){x.intentos++;x.error=e.message;await DB.put('cola',x);}if(manual)toast(e.message,true);return;}
    let bien=0;
    for(const r of res){const x=q.find(i=>i.id===r.id);if(!x)continue;
      x.estado=r.ok?'Sincronizado':'Error';x.error=r.ok?'':r.error;x.enviado=Date.now();if(r.ok)bien++;await DB.put('cola',x);}
    ultimoError='';toast(bien+' de '+q.length+' registro(s) enviado(s)',bien<q.length);
  }finally{syncing=false;await pintarCola();}
}

/* ============ UI ============ */
let tt;function toast(m,mal){const t=$('toast');t.textContent=m;t.style.background=mal?'#8f1a0e':'#2b2f2a';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',4200);}
function showErr(id,m){const e=$(id);e.textContent=m;e.style.display=m?'block':'none';if(m)e.scrollIntoView({block:'center',behavior:'smooth'});}
function setNet(){const on=navigator.onLine;$('net').textContent=on?'En línea':'Sin conexión';$('net').className='pill'+(on?'':' off');}
function tab(id){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===id));window.scrollTo(0,0);if(id==='p3')pintarCola();}
async function cargarListas(){
  M={};(await DB.all('maestros')).forEach(m=>M[m.placa]=m);
  P={};(await DB.all('personal')).forEach(p=>P[p.dni]=p.nombre);
  $('dl_placas').innerHTML=Object.keys(M).sort().map(p=>'<option value="'+esc(p)+'">').join('');
  if(!Object.keys(M).length)showErr('r_err','Aún no hay placas. Conéctate a internet una vez para descargar las placas y el personal.');
  else if($('r_err').textContent.startsWith('Aún'))showErr('r_err','');
  autoPlaca('r');autoPlaca('a');
}
function autoPlaca(k){const v=$(k+'_placa').value.trim().toUpperCase(),m=M[v];
  if(k==='r'){['conductor','tipo','ruta','cultivo'].forEach(f=>$('r_'+f).value=m?m[f]:'');$('r_cap').value=m?m.capacidad:'';libres();}
  else $('a_ruta').value=m?m.ruta:'';}
function libres(){const c=+$('r_cap').value,p=$('r_pas').value;$('r_libres').value=(p===''||!c)?'':c-(+p);}
function buscarDni(){const d=$('a_dni').value=$('a_dni').value.replace(/\D/g,'').slice(0,8);const m=$('a_dnimsg');
  if(d.length<8){$('a_nombre').value='';m.textContent=d?d.length+' de 8 dígitos':'';m.className='hint';return;}
  const n=P[d];$('a_nombre').value=n||'';m.textContent=n?'Personal encontrado':'DNI no encontrado en la lista de personal';m.className=n?'hint ok':'hint mal';}
function reqObs(){const m=$('a_motivo').value;$('a_obsreq').textContent=m.includes('Especificar')?'(obligatorio para este motivo)':'';}
function cambiaRegresa(){const si=$('a_regresa').value==='SI';$('b_ret').style.display=si?'block':'none';cambiaRet();}
function cambiaRet(){$('a_retf').style.display=($('a_regresa').value==='SI'&&$('a_ret').value==='Ingrese la fecha')?'block':'none';}

async function encolar(tipo,datos){
  await DB.put('cola',{id:uid(),tipo,datos,estado:'Pendiente',intentos:0,creado:Date.now(),error:''});
  await pintarCola();enviarPendientes(false);
}
async function guardarRegistro(){
  const b=$('r_save');showErr('r_err','');
  const placa=$('r_placa').value.trim().toUpperCase(),m=M[placa],pas=$('r_pas').value,f=$('r_fecha').value;
  let e='';
  if(!f)e='Elige la fecha.';else if(!m)e='Elige una placa de la lista.';
  else if(pas===''||!/^\d+$/.test(pas))e='Escribe el número de pasajeros (entero, mínimo 0).';
  else if(+pas>m.capacidad)e='Los pasajeros no pueden superar la capacidad de '+m.capacidad+'.';
  if(e)return showErr('r_err',e);
  const dup=(await DB.all('cola')).some(x=>x.tipo==='registro'&&x.estado!=='Error'&&x.datos.placa===placa&&x.datos.fecha===f);
  if(dup&&!confirm('Ya registraste esta placa hoy. ¿Guardar otro registro?'))return;
  b.disabled=true;
  try{await encolar('registro',{fecha:f,placa,conductor:m.conductor,tipo:m.tipo,ruta:m.ruta,cultivo:m.cultivo,capacidad:m.capacidad,pasajeros:+pas,libres:m.capacidad-(+pas),observaciones:$('r_obs').value.trim()});
    $('r_placa').value='';$('r_pas').value='';$('r_obs').value='';autoPlaca('r');toast('Guardado. Se enviará al tener conexión.');}
  catch(x){showErr('r_err','No se pudo guardar en el teléfono: '+x.message);}finally{b.disabled=false;}
}
async function guardarAusentismo(){
  const b=$('a_save');showErr('a_err','');
  const placa=$('a_placa').value.trim().toUpperCase(),m=M[placa],dni=$('a_dni').value,nombre=P[dni],falta=$('a_falta').value,
   motivo=$('a_motivo').value,reg=$('a_regresa').value,obs=$('a_obs').value.trim();
  let ret='',e='';
  if(!m)e='Elige una placa de la lista.';
  else if(!/^\d{8}$/.test(dni))e='El DNI debe tener 8 dígitos.';
  else if(!nombre)e='DNI no encontrado en la lista de personal.';
  else if(!falta)e='Elige la fecha de falta.';
  else if(falta>hoy())e='La fecha de falta no puede ser futura.';
  else if(!motivo)e='Elige el motivo de ausencia.';
  else if(motivo.includes('Especificar')&&!obs)e='Este motivo requiere detalle en observaciones.';
  else if(!reg)e='Indica si va a regresar.';
  if(!e&&reg==='SI'){ret=$('a_ret').value;
    if(ret==='Ingrese la fecha'){ret=$('a_retf').value;if(!ret)e='Elige la fecha de retorno.';else if(ret<falta)e='La fecha de retorno no puede ser anterior a la fecha de falta.';}}
  if(e)return showErr('a_err',e);
  b.disabled=true;
  try{await encolar('ausentismo',{placa,ruta:m.ruta,dni,nombre,fechaFalta:falta,motivo,regresa:reg,retorno:ret,observaciones:obs});
    ['a_dni','a_obs','a_placa'].forEach(i=>$(i).value='');$('a_motivo').value='';$('a_regresa').value='';buscarDni();autoPlaca('a');reqObs();cambiaRegresa();toast('Guardado. Se enviará al tener conexión.');}
  catch(x){showErr('a_err','No se pudo guardar en el teléfono: '+x.message);}finally{b.disabled=false;}
}
async function pintarCola(){
  const q=(await DB.all('cola')).sort((a,b)=>b.creado-a.creado),n=q.filter(x=>x.estado!=='Sincronizado').length;
  ['nPend','nPend2'].forEach(i=>{$(i).textContent=n;$(i).style.display=n?'inline-block':'none';});
  $('cola').innerHTML=q.length?q.map(x=>{const d=x.datos,t=x.tipo==='registro'?'Movilidad · '+esc(d.placa)+' · '+d.pasajeros+' pasajeros':'Ausentismo · '+esc(d.nombre);
    return '<div class="item '+x.estado+'"><b>'+esc(t)+'</b><small>'+new Date(x.creado).toLocaleString('es-PE')+' · '+x.estado+'</small>'+
     (x.error?'<small class="mal">'+esc(x.error)+'</small>':'')+
     (x.estado==='Error'?'<button class="peq" data-a="re" data-id="'+x.id+'">Reintentar</button><button class="peq rojo" data-a="del" data-id="'+x.id+'">Eliminar</button>':'')+'</div>';}).join('')
   :'<p class="hint">No hay registros guardados todavía.</p>';
}
async function diagnostico(){
  const m=await DB.get('meta','ultima'),q=await DB.all('cola'),d=$('diag');
  d.style.display='block';
  d.textContent='URL: '+(CONFIG.API_URL.includes('PEGA_AQUI')?'SIN CONFIGURAR':CONFIG.API_URL.slice(0,60)+'…')+'\nToken: '+(CONFIG.TOKEN.includes('PEGA_AQUI')?'SIN CONFIGURAR':'configurado')+
   '\nConexión: '+(navigator.onLine?'sí':'no')+'\nPlacas en el teléfono: '+Object.keys(M).length+'\nPersonal en el teléfono: '+Object.keys(P).length+
   '\nÚltima descarga: '+(m?new Date(m.v).toLocaleString('es-PE'):'nunca')+'\nPendientes: '+q.filter(x=>x.estado==='Pendiente').length+' · Con error: '+q.filter(x=>x.estado==='Error').length+'\nÚltimo error: '+(ultimoError||'ninguno')+'\nPrueba de conexión: ';
  try{await api('GET',{action:'ping'});d.textContent+='OK';}catch(e){d.textContent+=e.message;}
}

/* ============ INICIO ============ */
async function init(){
  $('r_fecha').value=hoy();$('a_falta').max=hoy();$('a_falta').value=hoy();
  $('a_motivo').innerHTML='<option value="">Elige el motivo…</option>'+CONFIG.MOTIVOS.map(m=>'<option>'+esc(m)+'</option>').join('');
  document.querySelectorAll('nav a').forEach(a=>a.onclick=e=>{e.preventDefault();tab(a.dataset.t);});
  $('r_placa').oninput=()=>autoPlaca('r');$('a_placa').oninput=()=>autoPlaca('a');$('r_pas').oninput=libres;
  $('a_dni').oninput=buscarDni;$('a_motivo').onchange=reqObs;$('a_regresa').onchange=cambiaRegresa;$('a_ret').onchange=cambiaRet;
  $('r_save').onclick=guardarRegistro;$('a_save').onclick=guardarAusentismo;
  $('btnSync').onclick=()=>enviarPendientes(true);$('btnCat').onclick=()=>actualizarCatalogos(true);$('btnDiag').onclick=diagnostico;
  $('cola').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const x=await DB.get('cola',b.dataset.id);if(!x)return;
    if(b.dataset.a==='del'){if(confirm('¿Eliminar este registro con error?'))await DB.del('cola',x.id);}
    else{x.estado='Pendiente';x.error='';await DB.put('cola',x);enviarPendientes(true);}pintarCola();};
  addEventListener('online',()=>{setNet();enviarPendientes(false);actualizarCatalogos(false);});addEventListener('offline',setNet);setNet();
  try{await DB.open();}catch(e){toast('Este navegador no permite guardar datos. Usa Chrome.',true);return;}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  for(const x of await DB.all('cola'))if(x.estado==='Sincronizado'&&Date.now()-x.enviado>7*864e5)await DB.del('cola',x.id);
  await cargarListas();await pintarCola();
  if(navigator.onLine){await actualizarCatalogos(false);await enviarPendientes(false);}
  setInterval(()=>{if(navigator.onLine)enviarPendientes(false);},60000);
  if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').then(r=>{
    r.onupdatefound=()=>{const w=r.installing;w&&(w.onstatechange=()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Nueva versión lista. Cierra y abre la app para actualizar.');});};}).catch(()=>{});
}
init();
</script></body></html>
