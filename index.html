<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrícola Huarmey - Control de Transporte y Ausentismo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E5328">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            agricola: {
              green: '#1E5328',
              lightGreen: '#E8F5E9',
              red: '#D32F2F'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f8; }
    .tab-active { border-bottom: 4px solid #1E5328; color: #1E5328; font-weight: bold; }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Encabezado con Logo -->
  <header class="bg-white shadow-md p-4 text-center sticky top-0 z-50">
    <div class="flex flex-col items-center justify-center">
      <img src="ICONO HUARMEY.png" alt="Agrícola Huarmey Logo" class="h-16 mb-1 object-contain" onerror="this.style.display='none'">
      <h1 class="text-xl font-bold text-agricola-green">Agrícola Huarmey</h1>
      <p class="text-xs text-gray-500">Sistema de Control de Transporte y Ausentismo</p>
    </div>
  </header>

  <!-- Indicador de Estado / Alerta de Conexión a Google Sheets -->
  <div id="status-bar" class="bg-green-100 text-green-900 px-4 py-2 text-xs font-semibold flex justify-between items-center border-b border-green-300">
    <div class="flex items-center space-x-2">
      <span id="status-dot" class="h-3 w-3 rounded-full bg-green-500 inline-block animate-pulse"></span>
      <span id="status-text">🟢 Conectado a Google Sheets</span>
    </div>
    <span id="queue-count" class="bg-white px-2 py-1 rounded text-xs border border-green-300 font-bold">
      GUARDANDO EN LA NUBE (0)
    </span>
  </div>

  <!-- Navegación por Pestañas -->
  <nav class="flex bg-white shadow border-b">
    <button id="tab-movilidades-btn" onclick="switchTab('movilidades')" class="flex-1 py-3 text-center font-medium text-gray-600 tab-active">
      🚌 Movilidades
    </button>
    <button id="tab-ausentismo-btn" onclick="switchTab('ausentismo')" class="flex-1 py-3 text-center font-medium text-gray-600">
      📋 Ausentismo
    </button>
  </nav>

  <!-- Contenedor Principal -->
  <main class="flex-grow p-4 max-w-lg mx-auto w-full">

    <!-- SECCIÓN 1: REGISTRO DE MOVILIDADES -->
    <section id="section-movilidades" class="bg-white rounded-xl shadow-md p-5 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-bold text-gray-800">Registro de Movilidades</h2>
        <button type="button" onclick="fetchMaestros(true)" class="bg-gray-100 text-xs text-agricola-green border border-agricola-green px-2 py-1 rounded hover:bg-green-50 font-semibold flex items-center gap-1">
          🔄 Actualizar Datos
        </button>
      </div>

      <form id="form-movilidad" onsubmit="handleSaveMovilidad(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">PLACA DE UNIDAD *</label>
          <select id="mov-placa" onchange="autoFillMovilidad()" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green font-semibold text-gray-800">
            <option value="">Seleccione una placa...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">CONDUCTOR</label>
          <input type="text" id="mov-conductor" readonly placeholder="Se autocompleta con la placa" class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-700 font-medium">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">TIPO</label>
            <input type="text" id="mov-tipo" readonly placeholder="---" class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-700">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">CAPACIDAD</label>
            <input type="number" id="mov-capacidad" readonly placeholder="0" class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 font-bold">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">RUTA</label>
            <input type="text" id="mov-ruta" readonly placeholder="---" class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-700">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">CULTIVO</label>
            <input type="text" id="mov-cultivo" readonly placeholder="---" class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-700">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">N° PASAJEROS *</label>
          <input type="number" id="mov-pasajeros" min="0" oninput="calculateSeats()" required placeholder="Ej. 15" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">ASIENTOS LIBRES</label>
          <input type="number" id="mov-asientos" readonly placeholder="0" class="w-full p-3 bg-green-50 border border-green-300 text-agricola-green font-bold rounded-lg text-lg">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">OBSERVACIONES</label>
          <textarea id="mov-observaciones" rows="2" placeholder="Opcional..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green"></textarea>
        </div>

        <button type="submit" class="w-full bg-agricola-green text-white font-bold py-4 rounded-lg shadow-lg hover:bg-green-800 transition text-lg">
          GUARDAR REGISTROS
        </button>
      </form>
    </section>

    <!-- SECCIÓN 2: REGISTRO DE AUSENTISMO -->
    <section id="section-ausentismo" class="bg-white rounded-xl shadow-md p-5 space-y-4 hidden">
      <h2 class="text-lg font-bold text-gray-800 border-b pb-2">Registro de Ausentismo</h2>

      <form id="form-ausentismo" onsubmit="handleSaveAusentismo(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">PLACA *</label>
          <select id="aus-placa" onchange="autoFillAusentismoPlaca()" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green font-semibold text-gray-800">
            <option value="">Seleccione Placa...</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">RUTA</label>
          <input type="text" id="aus-ruta" readonly placeholder="Se autocompleta con la placa" class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-700">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">DNI PERSONAL *</label>
          <input type="text" id="aus-dni" maxlength="8" pattern="\d{8}" oninput="searchDNI(this.value)" required placeholder="Ingrese 8 dígitos (Ej. 41573851)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green font-mono text-base">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">APELLIDOS Y NOMBRES</label>
          <input type="text" id="aus-nombres" readonly placeholder="Muestra nombres al digitar DNI..." class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg text-gray-800 font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">FECHA DE FALTA *</label>
          <input type="date" id="aus-fechafalta" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">MOTIVO DE AUSENCIA *</label>
          <select id="aus-motivo" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green">
            <option value="">Seleccione...</option>
            <option value="Ninguno">Ninguno</option>
            <option value="Descanso médico (Absentismo)">Descanso médico (Absentismo)</option>
            <option value="Permiso con papeleta (Absentismo)">Permiso con papeleta (Absentismo)</option>
            <option value="Enfermedad">Enfermedad</option>
            <option value="Problemas familiares">Problemas familiares</option>
            <option value="Transporte (Especificar en observaciones)">Transporte (Especificar en observaciones)</option>
            <option value="Otro trabajo (Especificar en observaciones)">Otro trabajo (Especificar en observaciones)</option>
            <option value="Desmotivación">Desmotivación</option>
            <option value="Sacar tarjeta">Sacar tarjeta</option>
            <option value="Pago">Pago</option>
            <option value="Horario">Horario</option>
            <option value="Alimentación">Alimentación</option>
            <option value="Campamento">Campamento</option>
            <option value="Ambiente laboral">Ambiente laboral</option>
            <option value="Renuncia (Especificar en observaciones)">Renuncia (Especificar en observaciones)</option>
            <option value="Problemas con el caporal (Especificar en observaciones)">Problemas con el caporal (Especificar en observaciones)</option>
            <option value="Estudios">Estudios</option>
            <option value="Viaje">Viaje</option>
            <option value="Accidente">Accidente</option>
            <option value="No desea continuar (Especificar en observaciones)">No desea continuar (Especificar en observaciones)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">OBSERVACIONES</label>
          <textarea id="aus-observaciones" rows="2" placeholder="Detalle observaciones adicionales..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">¿VAS A REGRESAR? *</label>
          <select id="aus-regresar" onchange="toggleRetornoSection()" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green">
            <option value="SI">SI</option>
            <option value="NO">NO</option>
            <option value="Lo está pensando">Lo está pensando</option>
          </select>
        </div>

        <div id="container-retorno" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">RETORNO</label>
            <select id="aus-retornotipo" onchange="toggleFechaRetornoInput()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green">
              <option value="Inmediato">Inmediato</option>
              <option value="Especificar fecha">Especificar fecha</option>
            </select>
          </div>
          <div id="container-fecharetorno" class="hidden">
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">FECHA DE RETORNO</label>
            <input type="date" id="aus-fecharetorno" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-agricola-green">
          </div>
        </div>

        <button type="submit" class="w-full bg-agricola-green text-white font-bold py-4 rounded-lg shadow-lg hover:bg-green-800 transition text-lg">
          GUARDAR REGISTRO
        </button>
      </form>
    </section>

  </main>

  <script>
    // URL DE PUBLICACIÓN DE TU GOOGLE APPS SCRIPT
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyAOg2TzF30aT_2nNp7uvIjty87Y6sRQFr62zskRLWO2VRJVTsut1W1662d-YuJRf1c/exec';

    // DATOS DE RESPALDO DE SEGURIDAD
    const DEFAULT_MAESTROS = [
      { placa: 'A9Z-969', conductor: 'MUÑOZ SILVA MANUEL', tipo: 'MINIBUS', capacidad: 32, ruta: 'INSCULAS - SEDE OLMOS', cultivo: 'SERVICIOS GENERALES' },
      { placa: 'W4M-851', conductor: 'TORRES CHINCHAY NELVER', tipo: 'COMBI', capacidad: 15, ruta: 'LA PILCA - SEDE OLMOS', cultivo: 'SERVICIOS GENERALES' }
    ];

    const DEFAULT_PERSONAL = [
      { dni: '41573851', nombres: 'GRACIELA TORO DÍAZ' },
      { dni: '42073638', nombres: 'HENRY ARTURO ALVAREZ LIZAMA' },
      { dni: '43246877', nombres: 'JOSÉ WILMER CHÁVEZ TAPIA' }
    ];

    let db;
    let maestrosData = DEFAULT_MAESTROS;
    let personalData = DEFAULT_PERSONAL;

    // Inicializar IndexedDB
    const request = indexedDB.open('AgricolaHuarmeyDB', 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('movilidades')) db.createObjectStore('movilidades', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('ausentismos')) db.createObjectStore('ausentismos', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('maestros')) db.createObjectStore('maestros', { keyPath: 'key' });
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      loadLocalMaestros();
      updateQueueCount();
    };

    function updateConnectionStatus(isConnected, message) {
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      const statusBar = document.getElementById('status-bar');

      if (isConnected) {
        statusDot.className = "h-3 w-3 rounded-full bg-green-500 inline-block animate-pulse";
        statusBar.className = "bg-green-100 text-green-900 px-4 py-2 text-xs font-semibold flex justify-between items-center border-b border-green-300";
        statusText.innerText = message || "🟢 Conectado a Google Sheets";
      } else {
        statusDot.className = "h-3 w-3 rounded-full bg-red-500 inline-block";
        statusBar.className = "bg-red-100 text-red-900 px-4 py-2 text-xs font-semibold flex justify-between items-center border-b border-red-300";
        statusText.innerText = message || "🔴 Sin conexión a Google Sheets (Modo Local)";
      }
    }

    function switchTab(tab) {
      document.getElementById('section-movilidades').classList.toggle('hidden', tab !== 'movilidades');
      document.getElementById('section-ausentismo').classList.toggle('hidden', tab !== 'ausentismo');
      document.getElementById('tab-movilidades-btn').classList.toggle('tab-active', tab === 'movilidades');
      document.getElementById('tab-ausentismo-btn').classList.toggle('tab-active', tab === 'ausentismo');
    }

    // Obtenemos los Maestros y Personal con JSONP
    function fetchMaestros(forceUser = false) {
      if (!navigator.onLine) {
        updateConnectionStatus(false, "🔴 Modos Offline - Sin internet");
        if (forceUser) alert('Modo Offline: Usando catálogos guardados localmente.');
        return;
      }

      let scriptLoaded = false;

      window.handleGoogleMaestros = function(response) {
        scriptLoaded = true;
        if (response && response.status === 'success') {
          if (response.maestros && response.maestros.length > 0) maestrosData = response.maestros;
          if (response.personal && response.personal.length > 0) personalData = response.personal;

          if (db) {
            const tx = db.transaction('maestros', 'readwrite');
            tx.objectStore('maestros').put({ key: 'maestros', value: maestrosData });
            tx.objectStore('maestros').put({ key: 'personal', value: personalData });
          }

          populatePlacas();
          updateConnectionStatus(true, "🟢 Conectado a Google Sheets (" + personalData.length + " personas)");

          if (forceUser) alert('✅ ¡Conexión exitosa a Google Sheets! ' + personalData.length + ' personas y ' + maestrosData.length + ' unidades cargadas.');
        } else {
          updateConnectionStatus(false, "⚠️ Error en la respuesta de Google Sheets");
        }
      };

      const script = document.createElement('script');
      script.src = `${APPS_SCRIPT_URL}?action=getMaestros&callback=handleGoogleMaestros&_ts=${Date.now()}`;
      script.onerror = () => {
        updateConnectionStatus(false, "🔴 Error de conexión con Google Sheets");
        populatePlacas();
      };
      document.body.appendChild(script);

      setTimeout(() => {
        if (!scriptLoaded) {
          updateConnectionStatus(false, "🔴 Tiempo de espera agotado al conectar con Google Sheets");
        }
        if (script.parentNode) document.body.removeChild(script);
      }, 6000);
    }

    function loadLocalMaestros() {
      populatePlacas();
      if (!db) return;

      const tx = db.transaction('maestros', 'readonly');
      const reqM = tx.objectStore('maestros').get('maestros');
      reqM.onsuccess = () => {
        if (reqM.result && reqM.result.value.length > 0) {
          maestrosData = reqM.result.value;
          populatePlacas();
        }
      };

      const reqP = tx.objectStore('maestros').get('personal');
      reqP.onsuccess = () => {
        if (reqP.result && reqP.result.value.length > 0) {
          personalData = reqP.result.value;
        }
      };

      if (navigator.onLine) fetchMaestros();
    }

    function populatePlacas() {
      const movSelect = document.getElementById('mov-placa');
      const ausSelect = document.getElementById('aus-placa');

      const currentMovVal = movSelect.value;
      const currentAusVal = ausSelect.value;

      movSelect.innerHTML = '<option value="">Seleccione una placa...</option>';
      ausSelect.innerHTML = '<option value="">Seleccione Placa...</option>';

      maestrosData.forEach(m => {
        movSelect.innerHTML += `<option value="${m.placa}">${m.placa}</option>`;
        ausSelect.innerHTML += `<option value="${m.placa}">${m.placa}</option>`;
      });

      if (currentMovVal) movSelect.value = currentMovVal;
      if (currentAusVal) ausSelect.value = currentAusVal;
    }

    // Autocompletado de Movilidad al seleccionar Placa
    function autoFillMovilidad() {
      const placa = document.getElementById('mov-placa').value;
      const item = maestrosData.find(m => String(m.placa).trim().toUpperCase() === String(placa).trim().toUpperCase());

      if (item) {
        document.getElementById('mov-conductor').value = item.conductor || '';
        document.getElementById('mov-tipo').value = item.tipo || '';
        document.getElementById('mov-capacidad').value = item.capacidad || 0;
        document.getElementById('mov-ruta').value = item.ruta || '';
        document.getElementById('mov-cultivo').value = item.cultivo || '';
        calculateSeats();
      } else {
        document.getElementById('mov-conductor').value = '';
        document.getElementById('mov-tipo').value = '';
        document.getElementById('mov-capacidad').value = '';
        document.getElementById('mov-ruta').value = '';
        document.getElementById('mov-cultivo').value = '';
        document.getElementById('mov-asientos').value = '';
      }
    }

    function calculateSeats() {
      const cap = parseInt(document.getElementById('mov-capacidad').value) || 0;
      const pas = parseInt(document.getElementById('mov-pasajeros').value) || 0;
      document.getElementById('mov-asientos').value = Math.max(0, cap - pas);
    }

    function autoFillAusentismoPlaca() {
      const placa = document.getElementById('aus-placa').value;
      const item = maestrosData.find(m => String(m.placa).trim().toUpperCase() === String(placa).trim().toUpperCase());
      if (item) {
        document.getElementById('aus-ruta').value = item.ruta || '';
      } else {
        document.getElementById('aus-ruta').value = '';
      }
    }

    // Búsqueda Instantánea de Personal por DNI (8 dígitos)
    function searchDNI(val) {
      val = val.trim();
      if (val.length === 8) {
        let cleanInputDNI = val;
        while (cleanInputDNI.length < 8) cleanInputDNI = '0' + cleanInputDNI;

        const p = personalData.find(item => {
          let cleanDni = String(item.dni).trim();
          while (cleanDni.length < 8) cleanDni = '0' + cleanDni;
          return cleanDni === cleanInputDNI;
        });

        if (p) {
          document.getElementById('aus-nombres').value = p.nombres;
        } else {
          document.getElementById('aus-nombres').value = '⚠️ DNI NO ENCONTRADO EN PADRÓN';
        }
      } else {
        document.getElementById('aus-nombres').value = '';
      }
    }

    function toggleRetornoSection() {
      const reg = document.getElementById('aus-regresar').value;
      document.getElementById('container-retorno').classList.toggle('hidden', reg !== 'SI');
    }

    function toggleFechaRetornoInput() {
      const tipo = document.getElementById('aus-retornotipo').value;
      document.getElementById('container-fecharetorno').classList.toggle('hidden', tipo !== 'Especificar fecha');
    }

    function handleSaveMovilidad(e) {
      e.preventDefault();
      const record = {
        fechaRegistro: new Date().toLocaleString('es-PE'),
        placa: document.getElementById('mov-placa').value,
        conductor: document.getElementById('mov-conductor').value,
        tipo: document.getElementById('mov-tipo').value,
        capacidad: document.getElementById('mov-capacidad').value,
        ruta: document.getElementById('mov-ruta').value,
        cultivo: document.getElementById('mov-cultivo').value,
        pasajeros: document.getElementById('mov-pasajeros').value,
        asientosLibres: document.getElementById('mov-asientos').value,
        observaciones: document.getElementById('mov-observaciones').value,
        status: 'Pendiente'
      };

      saveRecord('movilidades', record, () => {
        document.getElementById('form-movilidad').reset();
        document.getElementById('mov-asientos').value = '';
        alert('✅ Registro de Movilidad guardado correctamente.');
      });
    }

    function handleSaveAusentismo(e) {
      e.preventDefault();
      const reg = document.getElementById('aus-regresar').value;
      const tipoR = document.getElementById('aus-retornotipo').value;
      const fechaR = (reg === 'SI' && tipoR === 'Especificar fecha') ? document.getElementById('aus-fecharetorno').value : (reg === 'SI' ? tipoR : 'N/A');

      const record = {
        fechaRegistro: new Date().toLocaleString('es-PE'),
        placa: document.getElementById('aus-placa').value,
        ruta: document.getElementById('aus-ruta').value,
        dni: document.getElementById('aus-dni').value,
        nombres: document.getElementById('aus-nombres').value,
        fechaFalta: document.getElementById('aus-fechafalta').value,
        motivo: document.getElementById('aus-motivo').value,
        observaciones: document.getElementById('aus-observaciones').value,
        vasARegresar: reg,
        fechaRetorno: fechaR,
        status: 'Pendiente'
      };

      saveRecord('ausentismos', record, () => {
        document.getElementById('form-ausentismo').reset();
        alert('✅ Registro de Ausentismo guardado correctamente.');
      });
    }

    function saveRecord(storeName, record, callback) {
      if (!db) return;
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).add(record);
      tx.oncomplete = () => {
        updateQueueCount();
        syncPendingData();
        callback();
      };
    }

    function updateQueueCount() {
      let count = 0;
      if (!db) return;
      const tx = db.transaction(['movilidades', 'ausentismos'], 'readonly');
      tx.objectStore('movilidades').openCursor().onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) { if (cursor.value.status === 'Pendiente') count++; cursor.continue(); }
      };
      tx.objectStore('ausentismos').openCursor().onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) { if (cursor.value.status === 'Pendiente') count++; cursor.continue(); }
        else {
          document.getElementById('queue-count').innerText = `GUARDANDO EN LA NUBE (${count})`;
        }
      };
    }

    async function syncPendingData() {
      if (!navigator.onLine || !db) return;

      const syncStore = (storeName, typeName) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.openCursor().onsuccess = async (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (cursor.value.status === 'Pendiente') {
              const item = cursor.value;
              try {
                await fetch(APPS_SCRIPT_URL, {
                  method: 'POST',
                  mode: 'no-cors',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ type: typeName, data: item })
                });
                item.status = 'Sincronizado';
                cursor.update(item);
                updateQueueCount();
              } catch (err) { }
            }
            cursor.continue();
          }
        };
      };

      syncStore('movilidades', 'movilidad');
      syncStore('ausentismos', 'ausentismo');
    }

    window.addEventListener('online', () => {
      updateConnectionStatus(true, "🟢 Conectado a Google Sheets");
      fetchMaestros();
      syncPendingData();
    });

    window.addEventListener('offline', () => {
      updateConnectionStatus(false, "🔴 Modo Offline (Guardando localmente)");
    });

    // Carga inicial
    populatePlacas();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
