<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E5328">
<title>Movilidades y Ausentismo - Huarmey</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{--verde:#1E5328;--verde-bg:#E8F5E9;--rojo:#D32F2F;--rojo-bg:#FDECEA;--hueso:#F7F5F0;--gris:#6b665e;--borde:#cfcac0}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--hueso);color:#26231f;padding-bottom:84px}
header{background:var(--verde);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px}
header img{width:44px;height:44px;border-radius:8px;background:#fff;padding:2px}
header h1{font-size:17px;margin:0;line-height:1.2}
#status{padding:9px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--borde)}
#status.ok{background:var(--verde-bg);color:var(--verde)}
#status.warn{background:#FFF6D6;color:#7a5b00}
#status.bad{background:var(--rojo-bg);color:var(--rojo)}
#sendbar{display:none;padding:8px 14px;font-size:14px;font-weight:600;background:#fff;border-bottom:1px solid var(--borde)}
#sendbar.on{display:block}
#sendbar.busy::after{content:"";display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid var(--verde);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#sendbar.busy::after{animation:none}}
main{padding:14px;max-width:560px;margin:0 auto}
.page{display:none}.page.on{display:block}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select,textarea,button{font:inherit;min-height:48px;width:100%;padding:10px 12px;border:1.5px solid var(--borde);border-radius:10px;background:#fff;color:inherit}
input[readonly]{background:#eeece6;color:#444}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.err{color:var(--rojo);font-size:14px;min-height:0;margin-top:4px}
.err:empty{display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.libres{background:var(--verde-bg);color:var(--verde);font-weight:700;font-size:22px;text-align:center}
.btn{background:var(--verde);color:#fff;border:0;font-weight:700;margin-top:20px;cursor:pointer}
.btn:disabled{opacity:.55}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde);margin-top:10px}
.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:2px solid var(--verde);z-index:5}
nav button{border:0;border-radius:0;min-height:64px;background:#fff;font-weight:700;color:var(--gris);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button span{font-size:22px}
nav button.on{background:var(--verde-bg);color:var(--verde)}
#toast{position:fixed;left:12px;right:12px;bottom:76px;background:var(--verde);color:#fff;padding:14px;border-radius:12px;font-weight:600;z-index:9;display:none;text-align:center}
#toast.bad{background:var(--rojo)}
#upd{display:none;position:fixed;top:0;left:0;right:0;background:#f2b705;color:#000;padding:12px;text-align:center;font-weight:700;z-index:10;cursor:pointer}
details{margin-top:24px;background:#fff;border:1px solid var(--borde);border-radius:10px;padding:8px 12px}
summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.env{border-top:1px solid var(--borde);padding:8px 0;font-size:14px}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700}
.b-Pendiente{background:#FFF6D6;color:#7a5b00}.b-Sincronizado{background:var(--verde-bg);color:var(--verde)}.b-Error{background:var(--rojo-bg);color:var(--rojo)}
.env .btn{min-height:40px;margin-top:6px;width:auto;padding:6px 14px}
.aviso{background:var(--rojo-bg);color:var(--rojo);padding:10px;border-radius:10px;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div id="upd" role="button" tabindex="0">Nueva versión disponible, toca para actualizar</div>
<header>
  <img src="./logo.png" alt="Logo" onerror="this.style.display='none'">
  <h1>Agrícola Huarmey<br><small style="font-weight:400">Movilidades y ausentismo</small></h1>
</header>
<div id="status" class="warn" role="status">Conectando...</div>
<div id="sendbar" role="status"></div>

<main>
  <div id="vacio" class="aviso hidden">Conéctate una vez para descargar las placas y el personal.</div>

  <!-- PÁGINA 1: MOVILIDADES -->
  <section id="p-mov" class="page on" aria-label="Registro de movilidades">
    <label for="mv-placa">Placa de unidad *</label>
    <select id="mv-placa"></select><div class="err" id="e-mv-placa"></div>
    <label for="mv-conductor">Conductor</label><input id="mv-conductor" readonly>
    <div class="row">
      <div><label for="mv-tipo">Tipo</label><input id="mv-tipo" readonly></div>
      <div><label for="mv-cap">Capacidad</label><input id="mv-cap" readonly></div>
    </div>
    <label for="mv-ruta">Ruta</label><input id="mv-ruta" readonly>
    <label for="mv-cultivo">Cultivo</label><input id="mv-cultivo" readonly>
    <label for="mv-pas">N° de pasajeros *</label>
    <input id="mv-pas" type="number" inputmode="numeric" min="0" step="1"><div class="err" id="e-mv-pas"></div>
    <label for="mv-libres">Asientos libres</label><input id="mv-libres" class="libres" readonly value="-">
    <label for="mv-obs">Observaciones</label><textarea id="mv-obs" maxlength="500"></textarea>
    <button id="mv-guardar" class="btn" type="button">GUARDAR REGISTRO</button>
  </section>

  <!-- PÁGINA 2: AUSENTISMO -->
  <section id="p-aus" class="page" aria-label="Registro de ausentismo">
    <label for="au-placa">Placa *</label>
    <select id="au-placa"></select><div class="err" id="e-au-placa"></div>
    <label for="au-ruta">Ruta</label><input id="au-ruta" readonly>
    <label for="au-dni">DNI *</label>
    <input id="au-dni" type="text" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="8 dígitos"><div class="err" id="e-au-dni"></div>
    <label for="au-nombre">Apellidos y nombres</label><input id="au-nombre" readonly>
    <label for="au-falta">Fecha de falta *</label>
    <input id="au-falta" type="date"><div class="err" id="e-au-falta"></div>
    <label for="au-motivo">Motivo de ausencia *</label>
    <select id="au-motivo"></select><div class="err" id="e-au-motivo"></div>
    <label for="au-obs">Observaciones <span id="au-obs-req"></span></label>
    <textarea id="au-obs" maxlength="500"></textarea><div class="err" id="e-au-obs"></div>
    <label for="au-regresa">¿Vas a regresar? *</label>
    <select id="au-regresa"></select><div class="err" id="e-au-regresa"></div>
    <div id="au-ret-box" class="hidden">
      <label for="au-ret">Fecha de retorno</label>
      <select id="au-ret"></select>
      <input id="au-ret-fecha" type="date" class="hidden" style="margin-top:8px" aria-label="Fecha de retorno">
      <div class="err" id="e-au-ret"></div>
    </div>
    <button id="au-guardar" class="btn" type="button">GUARDAR AUSENTISMO</button>
  </section>

  <button id="btn-actualizar" class="btn sec" type="button">Actualizar placas y personal</button>
  <details id="envios">
    <summary>Mis envíos &nbsp;<span id="pend">Pendientes: 0</span></summary>
    <div id="lista-envios"></div>
  </details>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<nav>
  <button id="t-mov" class="on" type="button"><span aria-hidden="true">🚌</span>Movilidades</button>
  <button id="t-aus" type="button"><span aria-hidden="true">📋</span>Ausentismo</button>
</nav>

<script>
"use strict";

/* ========== Config: constantes al inicio ========== */
const Config = {
  // URL de la implementación web de Apps Script (termina en /exec). Ver guía de despliegue.
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbz-3jandHhFQnY02qOYBUy_U2lsjRNzKGiKl3mggY2C0ekZYwPPMuNkQRFKoBBFo8kQ/exec',
  // Debe ser IGUAL al TOKEN_INICIAL de Code.gs (barrera básica, no un secreto absoluto).
  API_KEY: 'HZ-7f3k9Qm2xR8vLp4Wc6Ns1',
  DB_NAME: 'BDXX_HUARMEY',
  MAX_REINTENTOS: 5,
  MAX_HISTORIAL: 40,
  MOTIVOS: ['Ninguno','Descanso médico (Absentismo)','Permiso con papeleta (Absentismo)','Enfermedad','Problemas familiares','Transporte (Especificar en observaciones)','Otro trabajo (Especificar en observaciones)','Desmotivación','Sacar tarjeta','Pago','Horario','Alimentación','Campamento','Ambiente laboral','Renuncia (Especificar en observaciones)','Problemas con el caporal (Especificar en observaciones)','Estudios','Viaje','Accidente','No desea continuar (Especificar en observaciones)'],
  REGRESAR: ['SI','NO','Lo está pensando'],
  ESPECIFICAR: '(Especificar en observaciones)'
};
const $ = (id) => document.getElementById(id);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
const dni8 = (v) => String(v == null ? '' : v).replace(/\D/g, '').padStart(8, '0');
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ========== Db: IndexedDB (movilidades, ausentismos, cache) ========== */
const Db = {
  _p: null,
  open() {
    if (!this._p) {
      this._p = new Promise((res, rej) => {
        const r = indexedDB.open(Config.DB_NAME, 1);
        r.onupgradeneeded = () => {
          const db = r.result;
          db.createObjectStore('movilidades', { keyPath: 'clientId' });
          db.createObjectStore('ausentismos', { keyPath: 'clientId' });
          db.createObjectStore('cache', { keyPath: 'key' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    return this._p;
  },
  async run(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  put(store, v) { return this.run(store, 'readwrite', (o) => o.put(v)); },
  get(store, k) { return this.run(store, 'readonly', (o) => o.get(k)); },
  all(store) { return this.run(store, 'readonly', (o) => o.getAll()); },
  del(store, k) { return this.run(store, 'readwrite', (o) => o.delete(k)); }
};

/* ========== Store: datos en memoria (maestros y personal) ========== */
const Store = {
  placas: new Map(), lista: [], personal: new Map(),
  totalMaestros: 0, totalPersonal: 0, fecha: null,
  set(d) {
    const m = new Map();
    (d.maestros || []).forEach((r) => m.set(r.placa, r));            // placa repetida: gana la última fila
    const todas = Array.from(m.values());
    this.lista = todas.filter((r) => r.estado !== 'BAJA').concat(todas.filter((r) => r.estado === 'BAJA'));
    this.placas = m;
    const p = new Map();
    (d.personal || []).forEach((r) => { if (!p.has(r[0])) p.set(r[0], r[1]); }); // DNI repetido: gana el primero
    this.personal = p;
    this.totalMaestros = d.totalMaestros || 0;
    this.totalPersonal = d.totalPersonal || 0;
    this.fecha = d.fecha || null;
  },
  vacio() { return this.placas.size === 0 && this.personal.size === 0; },
  resumen() { return this.totalMaestros + ' registros / ' + this.placas.size + ' placas / ' + this.totalPersonal + ' personas'; }
};

/* ========== Api: lectura JSONP y escritura POST ========== */
const Api = {
  configurado() { return Config.SCRIPT_URL.indexOf('PEGA_AQUI') !== 0; },
  AYUDA: 'No se pudo contactar al servidor de Google. Revisa en Apps Script: Implementar > Administrar implementaciones > Aplicación web, "Ejecutar como: Yo" y "Quién tiene acceso: Cualquier persona"; y que SCRIPT_URL sea la URL /exec vigente.',
  _url() { return Config.SCRIPT_URL + '?key=' + encodeURIComponent(Config.API_KEY) + '&t=' + Date.now(); },
  // Interpreta el texto devuelto por el servidor; si no es JSON, casi siempre es una página de Google (login/error)
  _parse(txt) {
    let d;
    try { d = JSON.parse(txt); }
    catch (e) {
      const er = new Error(/^\s*</.test(txt)
        ? 'Google devolvió una página web en lugar de datos: la implementación no es pública ("Cualquier persona") o la URL no es la vigente.'
        : 'Respuesta inválida del servidor.');
      er.fatal = true; throw er;
    }
    if (d && d.status === 'success') return d;
    const er = new Error((d && d.message) || 'Respuesta inválida del servidor.'); er.fatal = true; throw er;
  },
  async _readFetch() {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 30000);
    try {
      const r = await fetch(this._url(), { method: 'GET', redirect: 'follow', cache: 'no-store', signal: ctl.signal });
      return this._parse(await r.text());
    } finally { clearTimeout(t); }
  },
  _readJsonp() {
    return new Promise((res, rej) => {
      const cb = 'jsonp_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      const s = document.createElement('script');
      const fin = () => { clearTimeout(t); delete window[cb]; s.remove(); };
      const t = setTimeout(() => { fin(); rej(new Error('El servidor tardó demasiado en responder.')); }, 30000);
      window[cb] = (d) => {
        fin();
        if (d && d.status === 'success') res(d);
        else { const er = new Error((d && d.message) || 'Respuesta inválida del servidor.'); er.fatal = true; rej(er); }
      };
      s.onerror = () => { fin(); rej(new Error(Api.AYUDA)); };
      s.src = this._url() + '&callback=' + cb;
      document.head.appendChild(s);
    });
  },
  async read() {
    if (!this.configurado()) throw new Error('Falta configurar SCRIPT_URL en index.html.');
    try { return await this._readFetch(); }               // 1.º intento: fetch (mensajes de error claros)
    catch (e) {
      if (e.fatal) throw e;                                // el servidor respondió con un error real: mostrarlo
      console.warn('[Api] fetch falló, se prueba JSONP', e);
    }
    return await this._readJsonp();                        // 2.º intento: JSONP
  },
  async post(rec) {
    if (!this.configurado()) throw new Error('Falta configurar SCRIPT_URL en index.html.');
    let r;
    try {
      r = await fetch(Config.SCRIPT_URL, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key: Config.API_KEY, type: rec.tipo, clientId: rec.clientId, creado: rec.creado, data: rec.data })
      });
    } catch (e) { throw new Error(this.AYUDA); }
    const j = this._parse(await r.text());
    return j;
  }
};

/* ========== Ui: pantalla, estado, avisos ========== */
const Ui = {
  status(kind, txt) { const s = $('status'); s.className = kind; s.textContent = txt; },
  toast(txt, bad) {
    const t = $('toast'); t.textContent = txt; t.className = bad ? 'bad' : ''; t.style.display = 'block';
    clearTimeout(this._t); this._t = setTimeout(() => { t.style.display = 'none'; }, 3500);
  },
  err(id, msg) { $('e-' + id).textContent = msg || ''; },
  send(txt, busy) { const b = $('sendbar'); b.textContent = txt; b.className = 'on' + (busy ? ' busy' : ''); },
  fillSelect(sel, items, first) {
    const cur = sel.value; const f = document.createDocumentFragment();
    const o0 = document.createElement('option'); o0.value = ''; o0.textContent = first; f.appendChild(o0);
    items.forEach((it) => {
      const o = document.createElement('option'); o.value = it.value; o.textContent = it.label;
      if (it.gris) o.style.color = '#8a857c';
      f.appendChild(o);
    });
    sel.replaceChildren(f);
    if (cur && items.some((i) => i.value === cur)) sel.value = cur;
  },
  fillPlacas() {
    const items = Store.lista.map((r) => ({ value: r.placa, label: r.placa + (r.estado === 'BAJA' ? ' (BAJA)' : ''), gris: r.estado === 'BAJA' }));
    ['mv-placa', 'au-placa'].forEach((id) => Ui.fillSelect($(id), items, 'Selecciona una placa'));
    $('vacio').classList.toggle('hidden', !Store.vacio());
  },
  tab(cual) {
    $('p-mov').classList.toggle('on', cual === 'mov'); $('p-aus').classList.toggle('on', cual === 'aus');
    $('t-mov').classList.toggle('on', cual === 'mov'); $('t-aus').classList.toggle('on', cual === 'aus');
    window.scrollTo(0, 0);
  },
  async envios() {
    const todos = (await Db.all('movilidades')).concat(await Db.all('ausentismos'));
    const pend = todos.filter((r) => r.estado !== 'Sincronizado').length;
    $('pend').textContent = 'Pendientes: ' + pend;
    todos.sort((a, b) => (a.creado < b.creado ? 1 : -1));
    const f = document.createDocumentFragment();
    todos.slice(0, 30).forEach((r) => {
      const d = document.createElement('div'); d.className = 'env';
      const cab = document.createElement('div');
      const quien = r.tipo === 'movilidad' ? '🚌 ' + r.data.placa + ' · ' + r.data.pasajeros + ' pasajeros' : '📋 ' + r.data.nombre + ' · ' + r.data.fechaFalta;
      cab.textContent = quien + ' ';
      const b = document.createElement('span'); b.className = 'badge b-' + r.estado; b.textContent = r.estado; cab.appendChild(b);
      d.appendChild(cab);
      const fh = document.createElement('div'); fh.style.color = 'var(--gris)'; fh.textContent = new Date(r.creado).toLocaleString('es-PE'); d.appendChild(fh);
      if (r.estado === 'Error') {
        const m = document.createElement('div'); m.style.color = 'var(--rojo)'; m.textContent = (r.error || 'Error') + ' (intentos: ' + r.intentos + ')'; d.appendChild(m);
        const bt = document.createElement('button'); bt.type = 'button'; bt.className = 'btn'; bt.textContent = 'Reintentar';
        bt.addEventListener('click', () => Sync.reintentar(r));
        d.appendChild(bt);
      }
      f.appendChild(d);
    });
    if (!todos.length) { const p = document.createElement('div'); p.className = 'env'; p.textContent = 'Todavía no hay envíos.'; f.appendChild(p); }
    $('lista-envios').replaceChildren(f);
  }
};

/* ========== Sync: datos maestros y cola de envío ========== */
const Sync = {
  corriendo: false, refrescando: false,
  async cargarCache() {
    try {
      const c = await Db.get('cache', 'datos');
      if (c) { Store.set(c); Ui.fillPlacas(); Ui.status('bad', 'Sin conexión (modo offline) - ' + Store.resumen()); }
      else Ui.fillPlacas();
    } catch (e) { console.error('[Sync] Error leyendo caché', e); }
  },
  async refrescar(manual) {
    if (this.refrescando) return;
    this.refrescando = true;
    Ui.status('warn', 'Conectando...');
    try {
      const d = await Api.read();
      d.fecha = new Date().toISOString();
      Store.set(d);
      await Db.put('cache', Object.assign({ key: 'datos' }, { maestros: d.maestros, personal: d.personal, totalMaestros: d.totalMaestros, totalPersonal: d.totalPersonal, fecha: d.fecha }));
      Ui.fillPlacas();
      Ui.status('ok', 'Conectado a Google Sheets (' + Store.resumen() + ')');
      if (manual) Ui.toast('Actualizado: ' + Store.resumen());
      this.run();
    } catch (e) {
      console.error('[Sync] Error al leer Sheets', e);
      const off = !navigator.onLine;
      Ui.status('bad', off ? 'Sin conexión (modo offline)' : 'Error: ' + e.message);
      if (manual) Ui.toast(off ? 'Sin conexión' : e.message, true);
    } finally { this.refrescando = false; }
  },
  async pendientes() {
    const t = (await Db.all('movilidades')).concat(await Db.all('ausentismos'));
    return t.filter((r) => r.estado === 'Pendiente' || (r.estado === 'Error' && r.intentos < Config.MAX_REINTENTOS))
      .sort((a, b) => (a.creado < b.creado ? -1 : 1));
  },
  async run() {
    if (this.corriendo || !navigator.onLine) return;
    this.corriendo = true;
    let ok = 0, mal = 0;
    try {
      const cola = await this.pendientes();
      let n = cola.length;
      for (const r of cola) {
        const espera = Math.min(5000 * Math.pow(2, r.intentos || 0), 300000);
        if (r.estado === 'Error' && Date.now() - (r.ultimo || 0) < espera) { n--; continue; }
        Ui.send('Enviando ' + n + ' registro(s)...', true);
        const store = r.tipo === 'movilidad' ? 'movilidades' : 'ausentismos';
        try {
          await Api.post(r);
          r.estado = 'Sincronizado'; r.error = ''; ok++;
        } catch (e) {
          r.estado = 'Error'; r.error = e.message; r.intentos = (r.intentos || 0) + 1; r.ultimo = Date.now(); mal++;
          console.error('[Sync] Error al enviar', r.clientId, e);
        }
        await Db.put(store, r);
        n--;
      }
      await this.limpiar();
    } catch (e) { console.error('[Sync] Error en la cola', e); }
    finally {
      this.corriendo = false;
      if (mal) Ui.send(mal + ' con error', false);
      else if (ok) Ui.send('Sincronizado', false);
      else $('sendbar').className = '';
      Ui.envios().catch(() => {});
    }
  },
  async reintentar(r) {
    r.estado = 'Pendiente'; r.intentos = 0; r.ultimo = 0;
    await Db.put(r.tipo === 'movilidad' ? 'movilidades' : 'ausentismos', r);
    await Ui.envios(); this.run();
  },
  async limpiar() { // conserva solo los últimos sincronizados
    for (const s of ['movilidades', 'ausentismos']) {
      const ok = (await Db.all(s)).filter((r) => r.estado === 'Sincronizado').sort((a, b) => (a.creado < b.creado ? 1 : -1));
      for (const r of ok.slice(Config.MAX_HISTORIAL)) await Db.del(s, r.clientId);
    }
  }
};

/* ========== Forms: formularios y validación ========== */
const Forms = {
  init() {
    Ui.fillSelect($('au-motivo'), Config.MOTIVOS.map((m) => ({ value: m, label: m })), 'Selecciona el motivo');
    Ui.fillSelect($('au-regresa'), Config.REGRESAR.map((m) => ({ value: m, label: m })), 'Selecciona');
    Ui.fillSelect($('au-ret'), [{ value: 'Inmediato', label: 'Inmediato' }, { value: 'FECHA', label: 'Ingrese la fecha' }], 'Selecciona');
    $('au-falta').max = hoyISO();
    $('mv-placa').addEventListener('change', () => this.movPlaca());
    $('mv-pas').addEventListener('input', () => this.movLibres());
    $('mv-guardar').addEventListener('click', () => this.guardarMov());
    $('au-placa').addEventListener('change', () => { const r = Store.placas.get($('au-placa').value); $('au-ruta').value = r ? r.ruta : ''; Ui.err('au-placa'); });
    $('au-dni').addEventListener('input', () => this.buscarDni());
    $('au-motivo').addEventListener('change', () => this.motivo());
    $('au-regresa').addEventListener('change', () => this.regresa());
    $('au-ret').addEventListener('change', () => { $('au-ret-fecha').classList.toggle('hidden', $('au-ret').value !== 'FECHA'); });
    $('au-falta').addEventListener('change', () => { $('au-ret-fecha').min = $('au-falta').value; });
    $('au-guardar').addEventListener('click', () => this.guardarAus());
  },
  movPlaca() {
    const r = Store.placas.get($('mv-placa').value);
    $('mv-conductor').value = r ? r.conductor : ''; $('mv-tipo').value = r ? r.tipo : '';
    $('mv-cap').value = r ? r.capacidad : ''; $('mv-ruta').value = r ? r.ruta : ''; $('mv-cultivo').value = r ? r.cultivo : '';
    $('mv-pas').max = r ? r.capacidad : ''; Ui.err('mv-placa'); this.movLibres();
  },
  movLibres() {
    const cap = Number($('mv-cap').value), v = $('mv-pas').value;
    if (!$('mv-cap').value || v === '') { $('mv-libres').value = '-'; Ui.err('mv-pas'); return; }
    const p = Number(v);
    $('mv-libres').value = cap - p;
    Ui.err('mv-pas', p > cap ? 'No puede superar la capacidad (' + cap + ').' : '');
  },
  limpiarMov() { ['mv-conductor','mv-tipo','mv-cap','mv-ruta','mv-cultivo','mv-pas','mv-obs'].forEach((i) => { $(i).value = ''; }); $('mv-placa').value = ''; $('mv-libres').value = '-'; },
  async guardarMov() {
    const placa = $('mv-placa').value, r = Store.placas.get(placa), v = $('mv-pas').value, p = Number(v);
    let bad = false;
    if (!r) { Ui.err('mv-placa', 'Elige una placa.'); bad = true; }
    if (v === '' || !Number.isInteger(p) || p < 0) { Ui.err('mv-pas', 'Ingresa un número entero desde 0.'); bad = true; }
    else if (r && p > r.capacidad) { Ui.err('mv-pas', 'No puede superar la capacidad (' + r.capacidad + ').'); bad = true; }
    if (bad) return;
    const btn = $('mv-guardar'); btn.disabled = true;
    try {
      await Db.put('movilidades', {
        clientId: uid(), tipo: 'movilidad', creado: new Date().toISOString(), estado: 'Pendiente', intentos: 0, error: '',
        data: { placa: r.placa, conductor: r.conductor, tipo: r.tipo, ruta: r.ruta, cultivo: r.cultivo, capacidad: r.capacidad, pasajeros: p, observaciones: $('mv-obs').value.trim() }
      });
      this.limpiarMov(); Ui.toast('Registro guardado. Se enviará automáticamente.');
      await Ui.envios(); Sync.run();
    } catch (e) { console.error('[Forms] Error guardando movilidad', e); Ui.toast('No se pudo guardar: ' + e.message, true); }
    finally { btn.disabled = false; }
  },
  buscarDni() {
    const i = $('au-dni'); i.value = i.value.replace(/\D/g, '').slice(0, 8);
    $('au-nombre').value = ''; Ui.err('au-dni');
    if (i.value.length < 8) return;
    const n = Store.personal.get(dni8(i.value));
    if (n) $('au-nombre').value = n; else Ui.err('au-dni', 'DNI no encontrado en el padrón');
  },
  motivo() {
    const esp = $('au-motivo').value.indexOf(Config.ESPECIFICAR) >= 0;
    $('au-obs-req').textContent = esp ? '* (obligatorio)' : ''; Ui.err('au-motivo'); Ui.err('au-obs');
  },
  regresa() {
    const si = $('au-regresa').value === 'SI';
    $('au-ret-box').classList.toggle('hidden', !si);
    if (!si) { $('au-ret').value = ''; $('au-ret-fecha').value = ''; $('au-ret-fecha').classList.add('hidden'); }
    Ui.err('au-regresa');
  },
  limpiarAus() {
    ['au-ruta','au-dni','au-nombre','au-falta','au-obs','au-ret-fecha'].forEach((i) => { $(i).value = ''; });
    ['au-placa','au-motivo','au-regresa','au-ret'].forEach((i) => { $(i).value = ''; });
    $('au-ret-box').classList.add('hidden'); $('au-ret-fecha').classList.add('hidden'); $('au-obs-req').textContent = '';
  },
  async guardarAus() {
    ['au-placa','au-dni','au-falta','au-motivo','au-obs','au-regresa','au-ret'].forEach((i) => Ui.err(i));
    const placa = $('au-placa').value, r = Store.placas.get(placa), dni = $('au-dni').value, nombre = $('au-nombre').value;
    const falta = $('au-falta').value, motivo = $('au-motivo').value, obs = $('au-obs').value.trim(), reg = $('au-regresa').value;
    let bad = false;
    const e = (id, m) => { Ui.err(id, m); bad = true; };
    if (!r) e('au-placa', 'Elige una placa.');
    if (dni.length !== 8) e('au-dni', 'El DNI debe tener 8 dígitos.'); else if (!nombre) e('au-dni', 'DNI no encontrado en el padrón');
    if (!falta) e('au-falta', 'Elige la fecha de falta.'); else if (falta > hoyISO()) e('au-falta', 'No puede ser una fecha futura.');
    if (!motivo) e('au-motivo', 'Elige el motivo.');
    if (motivo.indexOf(Config.ESPECIFICAR) >= 0 && !obs) e('au-obs', 'Explica el motivo en observaciones.');
    if (!reg) e('au-regresa', 'Elige una opción.');
    let retorno = 'N/A';
    if (reg === 'SI') {
      const s = $('au-ret').value;
      if (!s) e('au-ret', 'Elige cuándo regresa.');
      else if (s === 'Inmediato') retorno = 'Inmediato';
      else {
        const f = $('au-ret-fecha').value;
        if (!f) e('au-ret', 'Ingresa la fecha de retorno.'); else if (falta && f < falta) e('au-ret', 'No puede ser anterior a la fecha de falta.'); else retorno = f;
      }
    }
    if (bad) return;
    const btn = $('au-guardar'); btn.disabled = true;
    try {
      await Db.put('ausentismos', {
        clientId: uid(), tipo: 'ausentismo', creado: new Date().toISOString(), estado: 'Pendiente', intentos: 0, error: '',
        data: { placa: r.placa, ruta: r.ruta, dni: dni, nombre: nombre, fechaFalta: falta, motivo: motivo, regresa: reg, fechaRetorno: retorno, observaciones: obs }
      });
      this.limpiarAus(); Ui.toast('Ausentismo guardado. Se enviará automáticamente.');
      await Ui.envios(); Sync.run();
    } catch (x) { console.error('[Forms] Error guardando ausentismo', x); Ui.toast('No se pudo guardar: ' + x.message, true); }
    finally { btn.disabled = false; }
  }
};

/* ========== Arranque ========== */
async function registrarSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.register('./service-worker.js', { scope: './' });
    const aviso = () => { const u = $('upd'); u.style.display = 'block'; u.onclick = () => { if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); }; };
    if (reg.waiting && navigator.serviceWorker.controller) aviso();
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) aviso(); });
    });
    let recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recargado) { recargado = true; location.reload(); } });
  } catch (e) { console.error('[SW] No se pudo registrar', e); }
}

document.addEventListener('DOMContentLoaded', async () => {
  $('t-mov').addEventListener('click', () => Ui.tab('mov'));
  $('t-aus').addEventListener('click', () => Ui.tab('aus'));
  $('btn-actualizar').addEventListener('click', () => Sync.refrescar(true));
  Forms.init();
  registrarSW();
  try { await Sync.cargarCache(); await Ui.envios(); } catch (e) { console.error('[Init] Error', e); }
  if (navigator.onLine) Sync.refrescar(false);
  else Ui.status('bad', 'Sin conexión (modo offline)' + (Store.vacio() ? '' : ' - ' + Store.resumen()));
  window.addEventListener('online', () => Sync.refrescar(false));
  window.addEventListener('offline', () => Ui.status('bad', 'Sin conexión (modo offline)' + (Store.vacio() ? '' : ' - ' + Store.resumen())));
  setInterval(async () => {
    try {
      if (!navigator.onLine) return;
      if ($('status').className === 'bad') await Sync.refrescar(false);
      if ((await Sync.pendientes()).length) Sync.run();
    } catch (e) { console.error('[Timer] Error', e); }
  }, 60000);
});
</script>
