<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrícola Huarmey - Control de Campo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1E4D2B">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    :root {
      --verde-agricola: #1E4D2B;
      --rojo-acento: #D32F2F;
      --fondo-neutro: #F4F6F4;
    }

    body {
      background-color: var(--fondo-neutro);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-bottom: 30px;
    }

    .navbar {
      background-color: var(--verde-agricola);
      color: white;
    }

    .brand-logo {
      height: 40px;
      margin-right: 10px;
    }

    .nav-tabs .nav-link {
      color: #495057;
      font-weight: 600;
    }

    .nav-tabs .nav-link.active {
      color: var(--verde-agricola);
      border-bottom: 3px solid var(--verde-agricola);
    }

    .btn-agricola {
      background-color: var(--verde-agricola);
      color: white;
      font-weight: bold;
      padding: 12px;
    }

    .btn-agricola:hover {
      background-color: #15371e;
      color: white;
    }

    .status-bar {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .alert-asientos {
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <nav class="navbar navbar-dark px-3 shadow-sm">
    <div class="d-flex align-items-center">
      <img src="ICONO HUARMEY.png" alt="Logo" class="brand-logo">
      <span class="navbar-brand mb-0 h1">Agrícola Huarmey</span>
    </div>
  </nav>

  <!-- Barra de Estado / Red -->
  <div id="statusBar" class="bg-secondary text-white text-center py-1 status-bar">
    <span id="statusNetwork"><i class="bi bi-wifi-off"></i> Comprobando conexión...</span> | 
    <span id="statusSync"><i class="bi bi-cloud"></i> Peticiones pendientes: 0</span>
  </div>

  <div class="container mt-3">
    <!-- Navegación por pestañas -->
    <ul class="nav nav-tabs nav-fill mb-3" id="mainTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="movilidad-tab" data-bs-toggle="tab" data-bs-target="#movilidad-panel" type="button" role="tab"><i class="bi bi-bus-front"></i> Movilidades</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="ausentismo-tab" data-bs-toggle="tab" data-bs-target="#ausentismo-panel" type="button" role="tab"><i class="bi bi-person-x"></i> Ausentismo</button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
      
      <!-- MÓDULO 1: REGISTRO DE MOVILIDADES -->
      <div class="tab-pane fade show active" id="movilidad-panel" role="tabpanel">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <form id="formMovilidad">
              <div class="mb-3">
                <label class="form-label fw-bold">Placa de Unidad *</label>
                <select class="form-select form-select-lg" id="movPlaca" required>
                  <option value="">Seleccione una placa...</option>
                </select>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label small">Conductor</label>
                  <input type="text" class="form-control bg-light" id="movConductor" readonly>
                </div>
                <div class="col-6">
                  <label class="form-label small">Tipo</label>
                  <input type="text" class="form-control bg-light" id="movTipo" readonly>
                </div>
                <div class="col-4">
                  <label class="form-label small">Capacidad</label>
                  <input type="number" class="form-control bg-light fw-bold" id="movCapacidad" readonly>
                </div>
                <div class="col-4">
                  <label class="form-label small">Ruta</label>
                  <input type="text" class="form-control bg-light" id="movRuta" readonly>
                </div>
                <div class="col-4">
                  <label class="form-label small">Cultivo</label>
                  <input type="text" class="form-control bg-light" id="movCultivo" readonly>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">N° Pasajeros Actuales *</label>
                <input type="number" class="form-control form-control-lg" id="movPasajeros" min="0" required>
              </div>

              <div class="mb-3">
                <div class="p-3 text-center rounded alert-asientos bg-light text-dark border" id="boxAsientos">
                  Asientos Libres: <span id="movAsientos">0</span>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Observaciones</label>
                <textarea class="form-control" id="movObs" rows="2" placeholder="Opcional..."></textarea>
              </div>

              <button type="submit" class="btn btn-agricola w-100 shadow-sm mb-2">
                <i class="bi bi-save"></i> GUARDAR REGISTRO
              </button>
              <button type="button" class="btn btn-outline-secondary w-100 btn-sm" id="btnUpdateMaestros">
                <i class="bi bi-arrow-repeat"></i> Actualizar Lista de Placas
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- MÓDULO 2: REGISTRO DE AUSENTISMO -->
      <div class="tab-pane fade" id="ausentismo-panel" role="tabpanel">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <form id="formAusentismo">
              <div class="mb-3">
                <label class="form-label fw-bold">Placa de Unidad *</label>
                <select class="form-select" id="ausPlaca" required>
                  <option value="">Seleccione una placa...</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label small">Ruta</label>
                <input type="text" class="form-control bg-light" id="ausRuta" readonly>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">DNI Personal (8 dígitos) *</label>
                <input type="text" class="form-control" id="ausDni" maxlength="8" pattern="[0-9]{8}" placeholder="Ingrese DNI..." required>
              </div>

              <div class="mb-3">
                <label class="form-label small">Apellidos y Nombres</label>
                <input type="text" class="form-control bg-light fw-bold text-uppercase" id="ausNombres" readonly placeholder="Búsqueda por DNI...">
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Fecha de Falta *</label>
                <input type="date" class="form-control" id="ausFecha" required>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Motivo de Ausencia *</label>
                <select class="form-select" id="ausMotivo" required>
                  <option value="">Seleccione un motivo...</option>
                  <option value="Ninguno">Ninguno</option>
                  <option value="Descanso médico (Absentismo)">Descanso médico (Absentismo)</option>
                  <option value="Permiso con papeleta (Absentismo)">Permiso con papeleta (Absentismo)</option>
                  <option value="Enfermedad">Enfermedad</option>
                  <option value="Problemas familiares">Problemas familiares</option>
                  <option value="Transporte (Especificar en obs)">Transporte (Especificar en obs)</option>
                  <option value="Otro trabajo (Especificar en obs)">Otro trabajo (Especificar en obs)</option>
                  <option value="Desmotivación">Desmotivación</option>
                  <option value="Sacar tarjeta">Sacar tarjeta</option>
                  <option value="Pago">Pago</option>
                  <option value="Horario">Horario</option>
                  <option value="Alimentación">Alimentación</option>
                  <option value="Campamento">Campamento</option>
                  <option value="Ambiente laboral">Ambiente laboral</option>
                  <option value="Renuncia (Especificar en obs)">Renuncia (Especificar en obs)</option>
                  <option value="Problemas con el caporal (Especificar en obs)">Problemas con el caporal (Especificar en obs)</option>
                  <option value="Estudios">Estudios</option>
                  <option value="Viaje">Viaje</option>
                  <option value="Accidente">Accidente</option>
                  <option value="No desea continuar (Especificar en obs)">No desea continuar (Especificar en obs)</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label" id="lblAusObs">Observaciones</label>
                <textarea class="form-control" id="ausObs" rows="2"></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">¿Vas a regresar? *</label>
                <select class="form-select" id="ausRegresar" required>
                  <option value="">Seleccione...</option>
                  <option value="SI">SI</option>
                  <option value="NO">NO</option>
                  <option value="Lo está pensando">Lo está pensando</option>
                </select>
              </div>

              <div class="mb-3 d-none" id="groupRetorno">
                <label class="form-label fw-bold">Opciones de Retorno *</label>
                <select class="form-select mb-2" id="ausRetornoOpcion">
                  <option value="Inmediato">Inmediato</option>
                  <option value="Fecha específica">Fecha específica</option>
                </select>
                <input type="date" class="form-control d-none" id="ausFechaRetorno">
              </div>

              <button type="submit" class="btn btn-agricola w-100 shadow-sm">
                <i class="bi bi-save"></i> GUARDAR AUSENTISMO
              </button>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
