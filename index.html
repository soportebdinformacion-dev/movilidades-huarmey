<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrícola Huarmey - Control de Campo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
</head>
<body>

  <!-- Cabecera -->
  <header class="app-header">
    <div class="header-brand">
      <img src="ICONO HUARMEY.png" alt="Agrícola Huarmey" class="logo" id="appLogo">
      <h1>Agrícola Huarmey</h1>
    </div>
    <div class="status-bar">
      <span id="netStatus" class="status-badge online">● Conectado</span>
      <span id="syncStatus" class="sync-badge">Pendientes: 0</span>
    </div>
  </header>

  <!-- Navegación por pestañas -->
  <nav class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('movilidadesTab')">Movilidades</button>
    <button class="tab-btn" onclick="switchTab('ausentismosTab')">Ausentismo</button>
  </nav>

  <main class="container">
    
    <!-- PÁGINA 1: Registros de Movilidades -->
    <section id="movilidadesTab" class="tab-content active">
      <div class="section-header">
        <h2>Registro de Pasajeros</h2>
        <button type="button" class="btn-secondary" id="btnSyncPlacas">Actualizar Lista de Placas</button>
      </div>

      <form id="formMovilidades">
        <div class="form-group">
          <label for="movPlaca">Placa de Unidad *</label>
          <select id="movPlaca" required>
            <option value="">Seleccione placa...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="movConductor">Conductor</label>
          <input type="text" id="movConductor" readonly class="readonly-input">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="movTipoCap">Tipo / Capacidad</label>
            <input type="text" id="movTipoCap" readonly class="readonly-input">
          </div>
          <div class="form-group">
            <label for="movRutaCultivo">Ruta / Cultivo</label>
            <input type="text" id="movRutaCultivo" readonly class="readonly-input">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="movPasajeros">N° Pasajeros *</label>
            <input type="number" id="movPasajeros" min="0" required placeholder="0">
          </div>
          <div class="form-group">
            <label for="movAsientosLibres">Asientos Libres</label>
            <input type="number" id="movAsientosLibres" readonly class="readonly-input highlighted">
          </div>
        </div>

        <div class="form-group">
          <label for="movObservaciones">Observaciones</label>
          <textarea id="movObservaciones" rows="3" placeholder="Detalles opcionales..."></textarea>
        </div>

        <button type="submit" class="btn-primary">Guardar Registro</button>
      </form>
    </section>

    <!-- PÁGINA 2: Registro de Ausentismo -->
    <section id="ausentismosTab" class="tab-content">
      <h2>Registro de Ausentismo</h2>

      <form id="formAusentismos">
        <div class="form-group">
          <label for="ausPlaca">Placa y Ruta *</label>
          <select id="ausPlaca" required>
            <option value="">Seleccione placa...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ausDni">DNI Personal (8 dígitos) *</label>
          <input type="text" id="ausDni" maxlength="8" pattern="\d{8}" required placeholder="Ingrese DNI">
        </div>

        <div class="form-group">
          <label for="ausNombre">Apellidos y Nombres</label>
          <input type="text" id="ausNombre" readonly class="readonly-input">
        </div>

        <div class="form-group">
          <label for="ausFechaFalta">Fecha de Falta *</label>
          <input type="date" id="ausFechaFalta" required>
        </div>

        <div class="form-group">
          <label for="ausMotivo">Motivo de Ausencia *</label>
          <select id="ausMotivo" required>
            <option value="">Seleccione motivo...</option>
            <option value="Ninguno">Ninguno</option>
            <option value="Descanso médico">Descanso médico</option>
            <option value="Permiso">Permiso</option>
            <option value="Enfermedad">Enfermedad</option>
            <option value="Transporte">Transporte</option>
            <option value="OTRO">OTRO</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ausRegresa">¿Vas a regresar? *</label>
          <select id="ausRegresa" required>
            <option value="">Seleccione...</option>
            <option value="SI">SI</option>
            <option value="NO">NO</option>
            <option value="Lo está pensando">Lo está pensando</option>
          </select>
        </div>

        <div class="form-group hidden" id="groupFechaRetorno">
          <label for="ausFechaRetorno">Fecha / Tipo de Retorno</label>
          <select id="ausTipoRetorno">
            <option value="Inmediato">Inmediato</option>
            <option value="Fecha Especifica">Elegir Fecha</option>
          </select>
          <input type="date" id="ausFechaRetorno" class="hidden mt-2">
        </div>

        <button type="submit" class="btn-primary">Guardar Ausentismo</button>
      </form>
    </section>

  </main>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
