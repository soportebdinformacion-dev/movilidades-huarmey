<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7D32">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Agrícola Huarmey - Control de Transporte</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#F4F6F8;color:#1F2937;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .ctl{min-height:52px;font-size:18px}
  .ro{background:#E8F5E9;color:#1F2937;font-weight:600}
</style>
</head>
<body class="pb-28">

<header class="sticky top-0 z-20 bg-white shadow" style="padding-top:env(safe-area-inset-top)">
  <div class="flex items-center gap-3 px-3 py-2 max-w-xl mx-auto">
    <img src="icons/logo.png" alt="Logo" class="w-12 h-12 shrink-0">
    <h1 class="flex-1 text-base font-bold leading-tight text-[#2E7D32]">Agrícola Huarmey<br><span class="text-gray-600 font-semibold">Control de Transporte</span></h1>
    <a href="https://soportebdinformacion-dev.github.io/AUSENTISMO-PLACAS/" target="_blank" rel="noopener"
       class="flex flex-col items-center justify-center text-[10px] font-bold text-white bg-[#D32F2F] rounded-lg px-2 py-1 min-w-[84px] min-h-[48px] text-center leading-tight">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg>
      AUSENTISMO PERSONAL
    </a>
  </div>
</header>

<main class="max-w-xl mx-auto p-3 space-y-4">
  <section class="bg-white rounded-2xl shadow p-4 space-y-3">
    <h2 class="font-bold text-lg text-[#2E7D32]">Registro de movilidad</h2>

    <label class="block"><span class="text-sm font-semibold">Placa de unidad</span>
      <select id="placa" class="ctl w-full mt-1 border-2 border-[#A5D6A7] rounded-xl px-3 bg-white"><option value="">Cargando…</option></select>
    </label>
    <p id="maestrosInfo" class="text-xs text-gray-500"></p>

    <div class="grid grid-cols-2 gap-3">
      <label class="block col-span-2"><span class="text-sm font-semibold">Conductor</span><input id="conductor" disabled class="ctl ro w-full mt-1 rounded-xl px-3 border"></label>
      <label class="block"><span class="text-sm font-semibold">Tipo</span><input id="tipo" disabled class="ctl ro w-full mt-1 rounded-xl px-3 border"></label>
      <label class="block"><span class="text-sm font-semibold">Capacidad</span><input id="capacidad" disabled class="ctl ro w-full mt-1 rounded-xl px-3 border"></label>
      <label class="block"><span class="text-sm font-semibold">Ruta</span><input id="ruta" disabled class="ctl ro w-full mt-1 rounded-xl px-3 border"></label>
      <label class="block"><span class="text-sm font-semibold">Cultivo</span><input id="cultivo" disabled class="ctl ro w-full mt-1 rounded-xl px-3 border"></label>
    </div>

    <label class="block"><span class="text-sm font-semibold">N° de pasajeros *</span>
      <input id="pasajeros" type="number" inputmode="numeric" min="0" step="1" placeholder="0" class="ctl w-full mt-1 border-2 border-[#A5D6A7] rounded-xl px-3">
    </label>
    <p id="warn" class="hidden text-sm font-semibold text-[#D32F2F] bg-[#FFEBEE] rounded-lg p-2"></p>

    <div id="libresBox" class="rounded-xl p-3 text-center bg-[#E8F5E9] border-2 border-[#A5D6A7]">
      <div class="text-sm font-semibold">Asientos libres</div>
      <div id="libres" class="text-4xl font-extrabold">—</div>
      <div id="formula" class="text-xs text-gray-600">Capacidad − Pasajeros</div>
    </div>

    <label class="block"><span class="text-sm font-semibold">Observaciones (opcional)</span>
      <textarea id="obs" rows="2" class="w-full mt-1 border-2 border-[#A5D6A7] rounded-xl px-3 py-2 text-lg"></textarea>
    </label>

    <button id="guardar" class="w-full min-h-[64px] rounded-2xl bg-[#2E7D32] active:bg-[#1B5E20] text-white text-xl font-bold flex items-center justify-center gap-2">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      Guardar / Enviar
    </button>
  </section>

  <section class="bg-white rounded-2xl shadow p-4">
    <div class="flex items-center justify-between mb-2">
      <h2 class="font-bold text-lg text-[#2E7D32]">Mis registros</h2>
      <button id="sync" class="min-h-[48px] px-4 rounded-xl bg-[#D32F2F] text-white font-bold text-sm">Sincronizar ahora (<span id="pend">0</span>)</button>
    </div>
    <ul id="lista" class="divide-y text-sm"></ul>
  </section>
</main>

<div id="net" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 px-4 py-2 rounded-full text-white text-sm font-bold shadow-lg" style="margin-bottom:env(safe-area-inset-bottom)"></div>
<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-40 px-4 py-3 rounded-xl text-white font-semibold shadow-lg max-w-[90%] text-center"></div>

<script>
// ============ CONFIGURACIÓN ============
// Pega aquí la URL de tu Web App de Apps Script (termina en /exec)
const API_URL = 'PEGA_AQUI_LA_URL_DE_TU_WEB_APP/exec';

// ============ IndexedDB ============
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('huarmey-db', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('registros', { keyPath: 'uid' });
      d.createObjectStore('maestros', { keyPath: 'placa' });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const tx = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const getAll = s => req(tx(s).getAll());
const put = (s, v) => req(tx(s, 'readwrite').put(v));
async function replaceMaestros(list) {
  const st = tx('maestros', 'readwrite'); await req(st.clear());
  for (const v of list) await req(tx('maestros', 'readwrite').put(v));
}

// ============ UI helpers ============
const $ = id => document.getElementById(id);
let maestros = [], syncing = false;
function toast(msg, ok = true) {
  const t = $('toast'); t.textContent = msg; t.style.background = ok ? '#2E7D32' : '#D32F2F';
  t.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 3500);
}
function netBadge() {
  const on = navigator.onLine, n = $('net');
  n.textContent = on ? '● Conectado' : '● Modo Offline';
  n.style.background = on ? '#2E7D32' : '#F57C00';
}
function fmtFecha(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

// ============ Maestros ============
function pintarPlacas() {
  const sel = $('placa'), cur = sel.value;
  sel.innerHTML = '<option value="">Seleccione placa…</option>' +
    maestros.sort((a, b) => a.placa.localeCompare(b.placa)).map(v => `<option value="${v.placa}">${v.placa}</option>`).join('');
  if (maestros.some(v => v.placa === cur)) sel.value = cur;
  $('maestrosInfo').textContent = maestros.length + ' unidades activas disponibles';
}
async function cargarMaestros() {
  maestros = await getAll('maestros'); pintarPlacas();   // primero lo local
  if (!navigator.onLine || API_URL.startsWith('PEGA_AQUI')) {
    if (API_URL.startsWith('PEGA_AQUI')) toast('Configura API_URL en index.html', false);
    return;
  }
  try {
    const r = await fetch(API_URL + '?t=' + Date.now());
    const j = await r.json();
    if (j.status !== 'success') throw new Error(j.message || 'Respuesta inválida');
    await replaceMaestros(j.vehiculos);
    maestros = j.vehiculos; pintarPlacas();
  } catch (e) {
    if (!maestros.length) toast('No se pudo cargar placas: ' + e.message, false);
  }
}
function actual() { return maestros.find(v => v.placa === $('placa').value); }
function rellenar() {
  const v = actual() || {};
  ['conductor', 'tipo', 'capacidad', 'ruta', 'cultivo'].forEach(k => $(k).value = v[k] ?? '');
  calc();
}
function calc() {
  const v = actual(), p = $('pasajeros').value, w = $('warn'), box = $('libresBox'), L = $('libres');
  w.classList.add('hidden');
  if (!v || p === '') { L.textContent = '—'; $('formula').textContent = 'Capacidad − Pasajeros'; box.style.cssText = ''; box.className = 'rounded-xl p-3 text-center bg-[#E8F5E9] border-2 border-[#A5D6A7]'; return null; }
  const libres = v.capacidad - Number(p);
  L.textContent = libres;
  $('formula').textContent = `${v.capacidad} − ${p} = ${libres}`;
  const bad = libres < 0, zero = libres === 0;
  box.className = 'rounded-xl p-3 text-center border-2 ' + (bad ? 'bg-[#FFEBEE] border-[#D32F2F] text-[#D32F2F]' : zero ? 'bg-orange-100 border-orange-500 text-orange-700' : 'bg-[#E8F5E9] border-[#A5D6A7]');
  if (Number(p) < 0) { w.textContent = 'El número de pasajeros no puede ser negativo.'; w.classList.remove('hidden'); }
  else if (bad) { w.textContent = `Advertencia: excede la capacidad (${v.capacidad}) en ${-libres} pasajero(s).`; w.classList.remove('hidden'); }
  return libres;
}

// ============ Registros ============
async function guardar() {
  const v = actual(), p = $('pasajeros').value;
  if (!v) return toast('Seleccione una placa', false);
  if (p === '' || Number(p) < 0 || !Number.isInteger(Number(p))) return toast('Ingrese un N° de pasajeros válido (≥ 0)', false);
  const libres = v.capacidad - Number(p);
  if (libres < 0 && !confirm(`Los pasajeros (${p}) exceden la capacidad (${v.capacidad}). ¿Guardar de todos modos?`)) return;
  const reg = {
    uid: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2)),
    fecha: fmtFecha(new Date()), placa: v.placa, conductor: v.conductor, tipo: v.tipo, ruta: v.ruta,
    cultivo: v.cultivo, capacidad: v.capacidad, pasajeros: Number(p), libres, observaciones: $('obs').value.trim(),
    estado: 'PENDIENTE', error: ''
  };
  await put('registros', reg);               // 1) siempre local primero
  $('pasajeros').value = ''; $('obs').value = ''; calc();
  toast('Guardado localmente');
  await pintarLista();
  sincronizar();                             // 2) intento de envío
}
async function enviar(reg) {
  const body = JSON.stringify({ ...reg, estado: undefined, error: undefined });
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
  const j = await r.json();
  if (j.status !== 'success') throw new Error(j.message || 'Error del servidor');
}
async function sincronizar() {
  if (syncing || !navigator.onLine) return;
  if (API_URL.startsWith('PEGA_AQUI')) return toast('Configura API_URL en index.html', false);
  syncing = true;
  try {
    const todos = await getAll('registros');
    const pend = todos.filter(r => r.estado !== 'SINCRONIZADO').sort((a, b) => a.fecha.localeCompare(b.fecha));
    let ok = 0, fail = 0;
    for (const r of pend) {
      try { await enviar(r); r.estado = 'SINCRONIZADO'; r.error = ''; ok++; }
      catch (e) { r.estado = 'ERROR'; r.error = e.message; fail++; }
      await put('registros', r);
    }
    if (ok) toast(`${ok} registro(s) sincronizado(s)`);
    if (fail) toast(`${fail} registro(s) con error. Se reintentará.`, false);
  } finally { syncing = false; await pintarLista(); }
}
async function pintarLista() {
  const todos = (await getAll('registros')).sort((a, b) => b.fecha.localeCompare(a.fecha));
  $('pend').textContent = todos.filter(r => r.estado !== 'SINCRONIZADO').length;
  const col = { PENDIENTE: 'bg-orange-500', SINCRONIZADO: 'bg-[#2E7D32]', ERROR: 'bg-[#D32F2F]' };
  $('lista').innerHTML = todos.slice(0, 30).map(r => `
    <li class="py-2 flex items-start justify-between gap-2">
      <div><div class="font-bold">${r.placa} <span class="font-normal text-gray-500">· ${r.pasajeros}/${r.capacidad} pas. · ${r.libres} libres</span></div>
      <div class="text-xs text-gray-500">${r.fecha}${r.error ? ' · ' + r.error : ''}</div></div>
      <span class="text-white text-[11px] font-bold px-2 py-1 rounded-full ${col[r.estado]}">${r.estado}</span>
    </li>`).join('') || '<li class="py-3 text-gray-500">Aún no hay registros.</li>';
}

// ============ Init ============
window.addEventListener('online', () => { netBadge(); cargarMaestros(); sincronizar(); });
window.addEventListener('offline', netBadge);
$('placa').addEventListener('change', rellenar);
$('pasajeros').addEventListener('input', calc);
$('guardar').addEventListener('click', guardar);
$('sync').addEventListener('click', () => navigator.onLine ? sincronizar() : toast('Sin conexión', false));

(async () => {
  netBadge();
  await openDB();
  await pintarLista();
  await cargarMaestros();
  sincronizar();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'SYNC') sincronizar(); });
      if ('sync' in reg) window.addEventListener('offline', () => reg.sync.register('sync-registros').catch(() => {}));
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
